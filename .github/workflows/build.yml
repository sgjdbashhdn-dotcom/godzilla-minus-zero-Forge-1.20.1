
name: Build Godzilla Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name build.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build

      - uses: actions/upload-artifact@v4
        with:
          name: Godzilla-Mod-JAR
          path: extracted/**/build/libs/*.jar
